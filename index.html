/* ============ INTERAKTION ============ */
function dismissBotCardNotice(){
  S.botCardNotice = null;
  render();
  if (typeof scheduleBot === 'function') {
    botBusy = false;          // sicherstellen, dass der Bot nicht blockiert bleibt
    scheduleBot(400);
  }
}

function resolvePendingWarning(){
  S.pendingWarning = null;
  render();
}

function dismissWinOverlay(){
  S.winOverlayDismissed = true;
  render();
}

function cancelMode(){ S.mode=null; S.selected=null; S.legalMoves=[]; render(); }

function onSquareClick(r,c){
  try {
    onSquareClickInner(r,c);
  } catch(e) {
    console.error(e);
    log('Ein interner Fehler ist aufgetreten \u2013 Auswahl wurde zurückgesetzt: ' + e.message);
    S.mode=null; S.selected=null; S.legalMoves=[]; S.pendingOpts=null; S.chainHint=false;
    render();
  }
}

function onSquareClickInner(r,c){
  if (S.gameOver) return;
  if (onlineCode && S.turn !== onlineColor && !S.pendingCapture && !(S.mode && S.mode.type==='gegenschlag-offer')) {
    log('Online: Der Mitspieler ist am Zug.');
    render();
    return;
  }
  if (S.pendingCapture || S.pendingWarning) {
    log('Bitte zuerst die eingeblendete Frage über dem Brett beantworten.');
    render();
    return;
  }
  if (S.mode) { handleModeClick(r,c); return; }

  const piece = S.board[r][c];
  if (S.selected) {
    const m = S.legalMoves.find(mm=>mm.r===r && mm.c===c);
    if (m) {
      const [sr,sc] = S.selected;
      const opts = { ...(S.pendingOpts || {}) };
      if (m.special==='straight') opts.consumeTag = 'straightAvailable';
      const target = S.board[m.r][m.c];
      if (target && target.type!=='DECOY') {
        const options = getAvailableCaptureReactions(target.color);
        if (options.length>0) {
          S.pendingCapture = { sr, sc, m, opts, victimColor: target.color, options };
          S.selected=null; S.legalMoves=[];
          render();
          return;
        } else {
          const notReadyId = ['schutzschild','trugbild'].find(id=>S.hand[target.color].some(hc=>hc.id===id && !hc.ready));
          const notAffordable = ['schutzschild','trugbild']
            .map(id=>S.hand[target.color].find(hc=>hc.id===id && hc.ready))
            .find(hc=>hc);
          if (notReadyId) {
            log(`[Hinweis] ${label(target.color)} hat eine Reaktionskarte, aber sie wurde erst diese Runde gezogen und ist noch nicht einsatzbereit.`);
          } else if (notAffordable) {
            const cost = Math.max(0, notAffordable.cost - (isBehind(target.color)?1:0));
            log(`[Hinweis] ${label(target.color)} hat ${notAffordable.name} einsatzbereit, aber nur ${S.kristalle[target.color]} von ${cost} benötigten Kristallen \u2013 Schlag findet ohne Unterbrechung statt.`);
          }
        }
      }
      commitMove(sr,sc,m,opts);
      return;
    }
    if (piece && piece.color!==S.turn) {
      const em = S.flags.eiserneMauer;
      if (em && em.forColor===S.turn && piece.type==='P' && piece.color===em.owner) {
        S.pendingWarning = {type:'eisernemauer-blocked', color:S.turn};
        render(); return;
      }
      const bw = S.flags.bollwerk;
      if (bw && bw.owner===piece.color && bw.square[0]===r && bw.square[1]===c) {
        S.pendingWarning = {type:'bollwerk-blocked', color:S.turn};
        render(); return;
      }
      if (S.tempShieldProtect && S.tempShieldProtect[0]===r && S.tempShieldProtect[1]===c) {
        S.pendingWarning = {type:'schutzschild-blocked', color:S.turn};
        render(); return;
      }
    }
    const fsBlock = S.flags.feldsperre;
    if (S.selected && fsBlock && fsBlock.forColor===S.turn && fsBlock.square[0]===r && fsBlock.square[1]===c) {
      S.pendingWarning = {type:'feldsperre-blocked', color:S.turn};
      render(); return;
    }
    if (piece && piece.color===S.turn) { selectPiece(r,c); return; }
    S.selected=null; S.legalMoves=[]; render(); return;
  }
  if (piece && piece.color===S.turn) {
    selectPiece(r,c);
    if (S.legalMoves.length===0 && !(typeof botClicking!=='undefined' && botClicking)) {
      log(`${pieceName(piece.type)} auf ${sqName(r,c)} hat gerade keinen möglichen Zug (blockiert oder würde den eigenen König im Schach lassen).`);
      render();
    }
    return;
  }
  if (piece && piece.color!==S.turn) {
    if (typeof botClicking!=='undefined' && botClicking) return;
    // Fremde Figur angeklickt: erklaeren warum nichts passiert
    if (typeof botColor!=='undefined' && botColor && S.turn===botColor) {
      log('Der Computergegner ist am Zug \u2013 bitte kurz warten.');
    } else {
      log(`${label(S.turn)} ist am Zug \u2013 diese Figur gehört ${label(piece.color)}.`);
    }
    render();
  }
}

function updateMidChainCheckState(moverColor){
  const other = opp(moverColor);
  S.checkInfo = inCheck(S.board, other) ? {color: other} : null;
}

function commitMove(sr,sc,m,opts){
  const movedPiece = S.board[sr][sc];
  const grantsChain = !opts.isSecondSegment && (opts.chain || (movedPiece.tags && movedPiece.tags.doubleJump));
  executeMove(sr,sc,m);
  if (opts.consumeAbility) { S.abilitiesUsed[S.turn][opts.consumeAbility]=true; }
  if (opts.consumeCardIndex!=null) { discardCard(S.turn, opts.consumeCardIndex); }
  if (opts.consumeTag) { S.board[m.r][m.c].tags[opts.consumeTag]=false; }
  S.selected=null; S.legalMoves=[]; S.pendingOpts=null;

  if (grantsChain && !wouldBeCheckmate(opp(S.turn))) {
    S.selected=[m.r,m.c];
    S.legalMoves = legalMovesFor(m.r,m.c,{});
    S.pendingOpts = {isSecondSegment:true};
    S.chainHint = true;
    updateMidChainCheckState(S.turn);
    render();
    return;
  }
  S.chainHint = false;
  finishTurnFlow();
}

function resolvePendingCapture(choiceId){
  const p = S.pendingCapture;
  if (!p) return;
  S.pendingCapture = null;
  if (choiceId) {
    const opt = p.options.find(o=>o.id===choiceId);
    if (opt) {
      S.kristalle[p.victimColor] -= opt.cost;
      discardCard(p.victimColor, opt.idx);
      if (choiceId==='schutzschild') {
        S.tempShieldProtect = [p.m.r, p.m.c];
        log(`${label(p.victimColor)} setzt Schutzschild ein \u2013 der Schlag wird verhindert! ${label(S.turn)} muss anders ziehen und darf diese Figur diesen Zug nicht mehr anvisieren.`);
        render();
        return;
      }
      if (choiceId==='trugbild') {
        const landing = computeBlockLandingSquare(p.sr, p.sc, p.m.r, p.m.c);
        const attacker = S.board[p.sr][p.sc];
        S.board[p.sr][p.sc] = null;
        S.board[landing[0]][landing[1]] = attacker;
        const samePos = landing[0]===p.sr && landing[1]===p.sc;
        log(`${label(p.victimColor)} blockt mit Trugbild! ${label(S.turn)}s Figur ${samePos ? 'bleibt auf ihrem Feld stehen' : 'bleibt auf '+sqName(landing[0],landing[1])+' stehen'} \u2013 ihr Zug ist beendet.`);
        S.selected=null; S.legalMoves=[]; S.pendingOpts=null; S.chainHint=false;
        finishTurnFlow();
        return;
      }
    }
  }
  commitMove(p.sr, p.sc, p.m, p.opts);
}

function closeAbilityInfo(){ if(openInfo.w||openInfo.b){ openInfo.w=null; openInfo.b=null; } }

function selectPiece(r,c,opts){
  closeAbilityInfo();
  S.selectedCard = null;
  S.selected=[r,c];
  S.legalMoves = legalMovesFor(r,c,opts||{});
  S.pendingOpts = null;
  S.chainHint = false;
  render();
}

function finishTurnFlow(){
  const sendOnline = () => {
    if (typeof onlineCode!=='undefined' && onlineCode) onlineSend();
  };
  if (S.gameOver) { render(); sendOnline(); return; }
  if (S.mode && S.mode.type==='gegenschlag-offer') { render(); return; }
  const mover = S.turn;
  endTurnChecks(mover);
  render();
  sendOnline();          // erst NACH dem Zugwechsel senden
}

function discardCard(color, idx){
  const [card] = S.hand[color].splice(idx,1);
  S.discard.push(card);
}

/* ---- Karten ziehen / spielen ---- */
function drawCard(color){
  if (S.deck.length===0) { S.deck = shuffle(S.discard); S.discard=[]; }
  S.kristalle[color]-=drawCostFor(color);
  const card = S.deck.pop();
  card.ready=false;
  S.hand[color].push(card);
  const flash = {color, t0:Date.now()};
  S.newCardFlash = flash;
  setTimeout(()=>{ if(S.newCardFlash===flash){ S.newCardFlash=null; render(); } }, 1200);
  // Gegnerische Karten bleiben geheim - nur die eigene wird namentlich genannt
  if (handIsHidden(color)) {
    log(`${color==='w'?'Weiß':'Schwarz'} zieht eine Karte.`);
  } else {
    log(`${color==='w'?'Weiß':'Schwarz'} zieht die Karte "${card.name}".`);
  }
  render();
}

function playCard(color, idx, force){
  if (S.gameOver || S.pendingCapture || S.pendingWarning) return;
  const card = S.hand[color][idx];
  if (!card) return;
  if (!force) {
    if (!card.ready) { log(`${label(color)}: Diese Karte wurde erst diese Runde gezogen \u2013 sie ist erst ab der nächsten eigenen Runde spielbar.`); render(); return; }
    const isReaction = card.type==='Reaktion';
    if (!isReaction) {
      if (S.turn!==color) { log(`${label(color)}: Karte kann nur im eigenen Zug gespielt werden.`); render(); return; }
      if (S.mode) { log(`${label(color)}: Erst die aktuell laufende Auswahl abschließen oder abbrechen, bevor eine neue Karte gespielt wird.`); render(); return; }
      if (S.playedCardThisTurn) { log(`${label(color)}: Es wurde diesen Zug bereits eine Karte gespielt.`); render(); return; }
      if (S.flags.zeitdruck && S.flags.zeitdruck.forColor===color) { log(`${label(color)}: Zeitdruck \u2013 diese Runde darf keine Karte gespielt werden.`); render(); return; }
    }
  }
  const cost = force ? 0 : Math.max(0, card.cost - (isBehind(color)?1:0));
  if (!force && S.kristalle[color] < cost) { log(`${label(color)}: Nicht genug Kristalle für diese Karte (Kosten: ${cost}).`); render(); return; }

  const pay = () => { if (!force) S.kristalle[color]-=cost; };

  switch(card.id){
    case 'kristallsegen1':
      pay(); addKristalle(color,2); log(`${label(color)} spielt Kristallsegen (+2 Kristalle).`);
      discardCard(color, idx); markPlayed(color); break;
    case 'kristallraub':
      if (S.kristalle[opp(color)]<=0) {
        S.pendingWarning = {type:'kristallraub-empty', color};
        render();
        return;
      }
      S.kristalle[opp(color)]--;
      pay();
      addKristalle(color,1);
      log(`${label(color)} spielt Kristallraub.`);
      showCenterPop(1);
      discardCard(color, idx); markPlayed(color); break;
    case 'damenopfer': {
      const q = findFirst(color,'Q');
      if (!q) return;
      pay(); S.board[q[0]][q[1]] = null; addKristalle(color,4);
      log(`${label(color)} opfert die Dame für 4 Kristalle.`);
      discardCard(color, idx); markPlayed(color); break;
    }
    case 'beforderung':
      if(!modeHasTargets('beforderung', color)){ log(`${label(color)}: Kein passender Bauer für Beförderung vorhanden.`); render(); return; }
      pay(); S.mode = {type:'beforderung', color, cardIndex: idx}; break;
    case 'springerinstinkt':
      if(!modeHasTargets('springerinstinkt', color)){ log(`${label(color)}: Kein Springer vorhanden.`); render(); return; }
      pay(); S.mode = {type:'springerinstinkt', color, cardIndex: idx}; break;
    case 'laeuferwandel':
      if(!modeHasTargets('laeuferwandel', color)){ log(`${label(color)}: Kein Läufer vorhanden.`); render(); return; }
      pay(); S.mode = {type:'laeuferwandel', color, cardIndex: idx}; break;
    case 'duo':
      if(!modeHasTargets('duo-select1', color)){ log(`${label(color)}: Keine zwei benachbarten Bauern vorhanden.`); render(); return; }
      pay(); S.mode = {type:'duo-select1', color, cardIndex: idx}; break;
    case 'wiedergeburt':
      if (S.capturedPawns[color]<=0) { log(`${label(color)}: Kein geschlagener Bauer zum Zurückholen.`); render(); return; }
      if(!modeHasTargets('wiedergeburt', color)){ log(`${label(color)}: Kein freies Feld auf der Bauernreihe.`); render(); return; }
      pay(); S.mode = {type:'wiedergeburt', color, cardIndex: idx}; break;
    case 'feldsperre':
      if(!modeHasTargets('feldsperre', color)){ log(`${label(color)}: Kein freies Feld vorhanden.`); render(); return; }
      pay(); S.mode = {type:'feldsperre', color, cardIndex: idx}; break;
    case 'trugbild':
      // wird nicht manuell gespielt, sondern automatisch angeboten, wenn eine eigene Figur angegriffen wird
      log(`${label(color)}: Trugbild wird automatisch angeboten, sobald eine eigene Figur angegriffen wird.`);
      return;
    case 'schutzschild':
      // wird nicht manuell gespielt, sondern automatisch angeboten, wenn eine eigene Figur geschlagen werden soll
      log(`${label(color)}: Schutzschild wird automatisch angeboten, sobald eine eigene Figur bedroht ist.`);
      return;
    case 'eisernemauer':
      if(!modeHasTargets('eisernemauer', color)){ log(`${label(color)}: Keine eigenen Bauern mehr.`); render(); return; }
      pay(); S.mode = {type:'eisernemauer', color, cardIndex: idx}; break;
    case 'zeitdruck':
      pay(); S.flags.zeitdruck = {forColor: opp(color)};
      log(`${label(color)} spielt Zeitdruck \u2013 Gegner darf nächste Runde keine Karte spielen.`);
      discardCard(color, idx); markPlayed(color); break;
    case 'doppelschritt':
      if(!modeHasTargets('doppelschritt-select', color)){ log(`${label(color)}: Keine Figur kann zweimal ziehen.`); render(); return; }
      pay(); S.mode = {type:'doppelschritt-select', color, cardIndex: idx}; break;
    case 'gegenschlag':
      // reine Reaktionskarte: wird automatisch angeboten, sobald eine eigene Figur geschlagen wird
      log(`${label(color)}: Gegenschlag wird automatisch angeboten, sobald eine eigene Figur geschlagen wurde.`);
      return;
  }
  render();
}

function markPlayed(color, isReactionArm){
  if (!isReactionArm) S.playedCardThisTurn = true;
}

let debugColor = 'w';
function setDebugColor(c){ debugColor = c; render(); }
function debugPlayCard(cardId){
  if (!S) return;
  S.mode=null; S.selected=null; S.legalMoves=[]; S.pendingOpts=null; S.chainHint=false;
  const def = CARD_DEFS.find(c=>c.id===cardId);
  if (!def) return;
  const card = {...def, uid:'debug-'+Math.random(), ready:true};
  S.hand[debugColor].push(card);
  const idx = S.hand[debugColor].length-1;
  if (cardId==='schutzschild' || cardId==='trugbild' || cardId==='gegenschlag') {
    if (S.kristalle[debugColor] < def.cost) {
      S.kristalle[debugColor] = def.cost;
      log(`[TEST] ${label(debugColor)} bekommt außerdem ${def.cost} Kristalle gutgeschrieben (Debug), damit die Reaktion bezahlbar ist.`);
    }
    log(`[TEST] ${label(debugColor)} bekommt ${def.name} einsatzbereit in die Hand (Debug) \u2013 versuche jetzt, eine Figur von ${label(debugColor)} zu schlagen.`);
    render();
    return;
  }
  if (cardId==='kristallraub' || cardId==='eisernemauer' || cardId==='feldsperre' || cardId==='damenopfer' || cardId==='zeitdruck') {
    card.ready = false;
    log(`[TEST] ${label(debugColor)} bekommt ${def.name} in die Hand (Debug) \u2013 wie gezogen, erst ab der nächsten eigenen Runde spielbar.`);
    render();
    return;
  }
  if (cardId==='wiedergeburt' && S.capturedPawns[debugColor]<=0) {
    S.capturedPawns[debugColor] = 1;
    log(`[TEST] ${label(debugColor)} bekommt einen geschlagenen Bauern gutgeschrieben (Debug), damit Wiedergeburt testbar ist.`);
  }
  log(`[TEST] ${label(debugColor)} spielt "${def.name}" direkt (Debug, kostenlos).`);
  playCard(debugColor, idx, true);
  if (S.mode && S.mode.type==='wiedergeburt') {
    const pawnRow = debugColor==='w' ? 6 : 1;
    const occ = [];
    for (let c=0;c<8;c++){
      const p = S.board[pawnRow][c];
      occ.push(`${sqName(pawnRow,c)}:${p ? (p.color+'/'+p.type) : 'frei'}`);
    }
    log(`[TEST] Bauernreihe von ${label(debugColor)} (Reihe ${8-pawnRow}) gerade: ${occ.join(', ')}`);
    const elig = modeEligibleSquares();
    if (elig.length===0) {
      log(`[TEST-HINWEIS] Kein freies Feld auf der Bauernreihe gefunden. Bewege dort einen Bauern weg (oder lass einen schlagen), dann klappt Wiedergeburt.`);
    } else {
      log(`[TEST] ${elig.length} wählbare Ziel(e): ${elig.map(sq=>sqName(sq[0],sq[1])).join(', ')}`);
    }
  } else if (S.mode && S.mode.type) {
    const elig = modeEligibleSquares();
    if (elig.length===0) {
      log(`[TEST-WARNUNG] Keine wählbaren Felder/Figuren für "${def.name}" gefunden (Modus: ${S.mode.type}, Farbe: ${label(debugColor)}).`);
    } else {
      log(`[TEST] ${elig.length} wählbare Ziel(e) gefunden: ${elig.map(sq=>sqName(sq[0],sq[1])).join(', ')}`);
    }
  }
  render();
}
function label(color){ return color==='w'?'Weiß':'Schwarz'; }
function findFirst(color, type){
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){
    const p=S.board[r][c]; if (p && p.color===color && p.type===type) return [r,c];
  }
  return null;
}

/* ---- Fähigkeiten ---- */
function startAbility(color, type){
  if (S.gameOver || S.turn!==color || S.mode) { log('Fähigkeit gerade nicht verfügbar.'); render(); return; }
  if (type==='K') { S.mode = {type:'notausweichen', color}; }
  else if (type==='Q') { S.mode = {type:'kristallschub-select', color}; }
  else if (type==='R') { S.mode = {type:'bollwerk-select', color}; }
  else if (type==='B') { S.mode = {type:'spiegelzug-select', color}; }
  else if (type==='N') { S.mode = {type:'doppelsprung-select', color}; }
  else if (type==='P') { S.mode = {type:'vorstoss-select', color}; }
  render();
}

function canUpgradePawnAt(r,c){
  const p = S.board[r][c];
  if (!p || p.type!=='P' || p.tags.isDuo) return false;
  if ((p.tags.stage||0) >= 2) return false;
  if (p.color !== S.turn) return false;
  if (S.gameOver || S.mode || S.pendingCapture || S.pendingWarning) return false;
  return true;
}

function upgradePawnAt(r,c){
  if (!canUpgradePawnAt(r,c)) return;
  const p = S.board[r][c];
  if (S.kristalle[p.color] < UPGRADE_COST) {
    S.pendingWarning = {type:'upgrade-nocrystals', color:p.color};
    render(); return;
  }
  S.kristalle[p.color] -= UPGRADE_COST;
  p.tags.stage = (p.tags.stage||0)+1;
  log(`${label(p.color)} wertet einen Bauern auf Stufe ${p.tags.stage} auf (${UPGRADE_COST} Kristalle).`);
  S.selected=null; S.legalMoves=[];
  render();
}

function startUpgradePawn(color){
  if (S.gameOver || S.turn!==color || S.mode) { render(); return; }
  S.mode = {type:'upgrade-pawn', color};
  render();
}

/* ---- Mode-Klicks ---- */
function handleModeClick(r,c){
  const m = S.mode;
  const piece = S.board[r][c];

  if (m.type==='gegenschlag-offer') return; // handled via buttons

  if (m.type==='upgrade-pawn') {
    if (!piece || piece.color!==m.color || piece.type!=='P' || (piece.tags.stage||0)>=2) return;
    S.kristalle[m.color]-=UPGRADE_COST;
    piece.tags.stage = (piece.tags.stage||0)+1;
    log(`${label(m.color)} wertet einen Bauern auf Stufe ${piece.tags.stage} auf.`);
    S.mode=null; render(); return;
  }
  if (m.type==='beforderung') {
    if (!piece || piece.color!==m.color || piece.type!=='P') return;
    piece.tags.stage=2;
    discardCard(m.color, m.cardIndex); markPlayed(m.color);
    log(`${label(m.color)} befördert einen Bauern direkt zum Wächter (Stufe 2).`);
    S.mode=null; render(); return;
  }
  if (m.type==='springerinstinkt') {
    if (!piece || piece.color!==m.color || piece.type!=='N') return;
    piece.tags.extraOrthogonal=true;
    discardCard(m.color, m.cardIndex); markPlayed(m.color);
    log(`${label(m.color)}er Springer erhält Springerinstinkt.`);
    S.mode=null; render(); return;
  }
  if (m.type==='laeuferwandel') {
    if (!piece || piece.color!==m.color || piece.type!=='B') return;
    piece.tags.straightAvailable=true;
    discardCard(m.color, m.cardIndex); markPlayed(m.color);
    log(`${label(m.color)}er Läufer kann einmalig gerade ziehen.`);
    S.mode=null; render(); return;
  }
  if (m.type==='wiedergeburt') {
    const pawnRow = m.color==='w' ? 6 : 1;
    if (r!==pawnRow || piece) return;
    S.board[r][c] = {type:'P', color:m.color, tags:{stage:0}};
    S.capturedPawns[m.color]--;
    discardCard(m.color, m.cardIndex); markPlayed(m.color);
    log(`${label(m.color)} lässt einen Bauern auf der Bauernreihe wiederauferstehen.`);
    S.mode=null; render(); return;
  }
  if (m.type==='eisernemauer') {
    if (!piece || piece.color!==m.color || piece.type!=='P') return;
    S.flags.eiserneMauer = {owner: m.color, forColor: opp(m.color)};
    discardCard(m.color, m.cardIndex); markPlayed(m.color);
    log(`${label(m.color)} aktiviert Eiserne Mauer \u2013 alle eigenen Bauern sind für den nächsten gegnerischen Zug geschützt.`);
    S.mode=null; render(); return;
  }
  if (m.type==='feldsperre') {
    if (piece) return;
    S.flags.feldsperre = {square:[r,c], forColor:opp(m.color)};
    discardCard(m.color, m.cardIndex); markPlayed(m.color);
    log(`${label(m.color)} sperrt Feld ${sqName(r,c)} für den Gegner.`);
    S.mode=null; render(); return;
  }
  if (m.type==='duo-select1') {
    if (!piece || piece.color!==m.color || piece.type!=='P' || piece.tags.isDuo) return;
    S.mode = {type:'duo-select2', color:m.color, cardIndex:m.cardIndex, first:[r,c]};
    render(); return;
  }
  if (m.type==='duo-select2') {
    const [fr,fc] = m.first;
    if (r===fr && c===fc) {
      // gleiche Figur nochmal angeklickt -> Auswahl des ersten Bauern aufheben
      S.mode = {type:'duo-select1', color:m.color, cardIndex:m.cardIndex};
      render(); return;
    }
    if (!piece || piece.color!==m.color || piece.type!=='P' || piece.tags.isDuo) return;
    const adjacent = (Math.abs(fr-r)+Math.abs(fc-c))===1;
    if (!adjacent) {
      // stattdessen einen anderen ersten Bauern waehlen
      S.mode = {type:'duo-select2', color:m.color, cardIndex:m.cardIndex, first:[r,c]};
      render(); return;
    }
    S.board[fr][fc] = null;
    piece.tags.isDuo = true;
    discardCard(m.color, m.cardIndex); markPlayed(m.color);
    log(`${label(m.color)} verschmilzt zwei Bauern zu Duo (Turm-Bewegung, zählt fortan als Turm-Wertigkeit).`);
    S.mode=null; render(); return;
  }
  if (m.type==='doppelschritt-select') {
    if (m.chosen) {
      const [pr,pc] = m.chosen;
      const dest = legalMovesFor(pr,pc,{}).find(d=>d.r===r&&d.c===c);
      if (dest) {
        executeMove(pr,pc,dest);
        discardCard(m.color, m.cardIndex); markPlayed(m.color);
        S.mode=null;
        S.selected=[dest.r,dest.c];
        S.legalMoves=legalMovesFor(dest.r,dest.c,{});
        S.pendingOpts={isSecondSegment:true};
        S.chainHint=true;
        updateMidChainCheckState(m.color);
        render(); return;
      }
      if (piece && piece.color===m.color && piece.type!=='K' && hasDoubleMove(r,c)) {
        S.mode = {type:'doppelschritt-select', color:m.color, cardIndex:m.cardIndex, chosen:[r,c]};
        S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{});
        render(); return;
      }
      S.mode = {type:'doppelschritt-select', color:m.color, cardIndex:m.cardIndex, chosen:null};
      S.selected=null; S.legalMoves=[];
      render(); return;
    }
    if (!piece || piece.color!==m.color || piece.type==='K' || !hasDoubleMove(r,c)) return;
    S.mode = {type:'doppelschritt-select', color:m.color, cardIndex:m.cardIndex, chosen:[r,c]};
    S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{});
    render(); return;
  }
  if (m.type==='bollwerk-select') {
    if (!piece || piece.color!==m.color || piece.type!=='R') return;
    S.flags.bollwerk = {square:[r,c], owner:m.color};
    S.abilitiesUsed[m.color]['R']=true;
    log(`${label(m.color)} verankert einen Turm (Bollwerk).`);
    S.mode=null; finishTurnFlow(); return;
  }
  if (m.type==='kristallschub-select') {
    if (!piece || piece.color!==m.color || piece.type!=='Q') return;
    S.abilitiesUsed[m.color]['Q']=true; S.abilitiesUsed[m.color]['Q_manual']=true;
    S.abilityMenu[m.color]=false;
    S.pendingQueenBoost = m.color;
    log(`${label(m.color)} aktiviert Kristallschub \u2013 nächster Damen-Schlag bringt +1 Kristall.`);
    S.mode=null; render(); return;
  }
  if (m.type==='spiegelzug-select') {
    if (m.chosen) {
      const [pr,pc] = m.chosen;
      const dest = legalMovesFor(pr,pc,{spiegelzugStep1:true}).find(d=>d.r===r&&d.c===c);
      if (dest) {
        executeMove(pr,pc,dest);
        S.abilitiesUsed[m.color]['B']=true; S.abilitiesUsed[m.color]['B_manual']=true;
        S.mode=null;
        S.selected=[dest.r,dest.c];
        S.legalMoves=legalMovesFor(dest.r,dest.c,{});
        S.pendingOpts={isSecondSegment:true};
        S.chainHint=true;
        updateMidChainCheckState(m.color);
        render(); return;
      }
      if (piece && piece.color===m.color && piece.type==='B' && legalMovesFor(r,c,{spiegelzugStep1:true}).length>0) {
        S.mode = {type:'spiegelzug-select', color:m.color, chosen:[r,c]};
        S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{spiegelzugStep1:true});
        render(); return;
      }
      S.mode = {type:'spiegelzug-select', color:m.color, chosen:null};
      S.selected=null; S.legalMoves=[];
      render(); return;
    }
    if (!piece || piece.color!==m.color || piece.type!=='B') return;
    if (legalMovesFor(r,c,{spiegelzugStep1:true}).length===0) { log('Dieser Läufer hat gerade kein freies andersfarbiges Nachbarfeld.'); return; }
    S.mode = {type:'spiegelzug-select', color:m.color, chosen:[r,c]};
    S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{spiegelzugStep1:true});
    render(); return;
  }
  if (m.type==='doppelsprung-select') {
    if (m.chosen) {
      const [pr,pc] = m.chosen;
      const dest = legalMovesFor(pr,pc,{}).find(d=>d.r===r&&d.c===c);
      if (dest) {
        executeMove(pr,pc,dest);
        S.abilitiesUsed[m.color]['N']=true; S.abilitiesUsed[m.color]['N_manual']=true;
        S.mode=null;
        S.selected=[dest.r,dest.c];
        S.legalMoves=legalMovesFor(dest.r,dest.c,{});
        S.pendingOpts={isSecondSegment:true};
        S.chainHint=true;
        updateMidChainCheckState(m.color);
        render(); return;
      }
      if (piece && piece.color===m.color && piece.type==='N') {
        S.mode = {type:'doppelsprung-select', color:m.color, chosen:[r,c]};
        S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{});
        render(); return;
      }
      S.mode = {type:'doppelsprung-select', color:m.color, chosen:null};
      S.selected=null; S.legalMoves=[];
      render(); return;
    }
    if (!piece || piece.color!==m.color || piece.type!=='N') return;
    S.mode = {type:'doppelsprung-select', color:m.color, chosen:[r,c]};
    S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{});
    render(); return;
  }
  if (m.type==='vorstoss-select') {
    const homeRow = m.color==='w'?6:1;
    if (m.chosen) {
      const [pr,pc] = m.chosen;
      const dest = legalMovesFor(pr,pc,{vorstoss:true}).find(d=>d.r===r&&d.c===c);
      if (dest) {
        executeMove(pr,pc,dest);
        S.abilitiesUsed[m.color]['P']=true;
        S.mode=null;
        S.selected=null; S.legalMoves=[];
        finishTurnFlow(); return;
      }
      if (piece && piece.color===m.color && piece.type==='P' && !piece.tags.isDuo && r!==homeRow) {
        S.mode = {type:'vorstoss-select', color:m.color, chosen:[r,c]};
        S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{vorstoss:true});
        render(); return;
      }
      S.mode = {type:'vorstoss-select', color:m.color, chosen:null};
      S.selected=null; S.legalMoves=[];
      render(); return;
    }
    if (!piece || piece.color!==m.color || piece.type!=='P' || piece.tags.isDuo || r===homeRow) return;
    S.mode = {type:'vorstoss-select', color:m.color, chosen:[r,c]};
    S.selected=[r,c]; S.legalMoves=legalMovesFor(r,c,{vorstoss:true});
    render(); return;
  }
  if (m.type==='notausweichen') {
    const k = findKing(S.board, m.color);
    if (!k) return;
    const adjacent = Math.max(Math.abs(k[0]-r),Math.abs(k[1]-c))===1;
    if (!adjacent || piece) return;
    const test = cloneBoard(S.board);
    test[r][c] = test[k[0]][k[1]];
    test[k[0]][k[1]] = null;
    if (inCheck(test, m.color)) { log('Dieses Feld ist weiterhin bedroht.'); return; }
    S.board[r][c] = S.board[k[0]][k[1]];
    S.board[k[0]][k[1]] = null;
    S.abilitiesUsed[m.color]['K']=true;
    S.abilityMenu[m.color]=false;
    log(`${label(m.color)} nutzt Notausweichen.`);
    S.checkInfo = null;
    S.mode=null; render(); return;
  }
}

function resolveGegenschlag(accept){
  const m = S.mode;
  if (!accept) { S.mode=null; finishTurnFlow(); return; }
  const card = S.hand[m.victimColor][m.cardIndex];
  const baseCost = card ? card.cost : 2;
  const cost = Math.max(0, baseCost - (isBehind(m.victimColor)?1:0));
  if (!card || S.kristalle[m.victimColor] < cost) { S.mode=null; finishTurnFlow(); return; }
  // Kein gueltiges Ziel mehr? Dann Karte gar nicht erst verbrauchen.
  if (adjacentOwnSquares(m.victimColor, m.atSquare).length===0) {
    log(`${label(m.victimColor)}: Keine eigene Figur mehr neben dem Angreifer \u2013 Gegenschlag bleibt auf der Hand.`);
    S.mode=null; finishTurnFlow(); return;
  }
  S.kristalle[m.victimColor]-=cost;
  discardCard(m.victimColor, m.cardIndex);
  S.mode = {type:'gegenschlag-select', color:m.victimColor, atSquare:m.atSquare};
  render();
}

/* extend handleModeClick for gegenschlag-select */
const _origHandle = handleModeClick;
handleModeClick = function(r,c){
  if (S.mode && S.mode.type==='gegenschlag-select') {
    const [ar,ac] = S.mode.atSquare;
    const attacker = S.board[ar][ac];
    if (!attacker || attacker.color!==opp(S.mode.color)) { S.mode=null; finishTurnFlow(); return; }
    // Der Spieler waehlt eine eigene Nachbarfigur, die den Gegenschlag ausfuehrt
    const chosen = S.board[r][c];
    const isNeighbour = Math.max(Math.abs(r-ar), Math.abs(c-ac))===1;
    if (!chosen || chosen.color!==S.mode.color || !isNeighbour) return;
    const counterColor = S.mode.color;
    log(`${label(counterColor)} kontert mit Gegenschlag: ${pieceName(chosen.type)} schlägt ${pieceName(attacker.type)} auf ${sqName(ar,ac)}.`);
    S.mode=null;
    doCapture(attacker, counterColor, [ar, ac], chosen);
    if (S.gameOver) { render(); return; }   // z.B. wenn dabei ein Koenig faellt
    S.board[ar][ac] = chosen;   // eigene Figur rueckt auf das Feld des Angreifers
    S.board[r][c] = null;
    finishTurnFlow();
    return;
  }
  _origHandle(r,c);
};

/* hook queen kristallschub into doCapture */
const _origDoCapture = doCapture;
doCapture = function(target, byColor, atSquare, attackerPiece){
  _origDoCapture(target, byColor, atSquare, attackerPiece);
  if (S.pendingQueenBoost===byColor) {
    // check the mover was actually queen: naive - grant once regardless of which piece captured, tied to explicit activation
    addKristalle(byColor,1);
    log(`Kristallschub: +1 zusätzlicher Kristall.`);
    S.pendingQueenBoost=null;
  }
};


/* ================= SUCH-ENGINE FUER DEN BOT ================= */
const AI_LEVELS = {
  leicht: {time: 250,  depth: 2, slip: 0.45, label: 'Leicht'},
  mittel: {time: 1200, depth: 3, slip: 0.18, label: 'Mittel'},
  stark:  {time: 3500, depth: 4, slip: 0.00, label: 'Stark'}
};
let aiLevel = 'leicht';           // Startstufe
function aiCfg(){ return AI_LEVELS[aiLevel] || AI_LEVELS.mittel; }

function aiDoMove(mv){
  const cap = S.board[mv.to[0]][mv.to[1]];
  const pc  = S.board[mv.from[0]][mv.from[1]];
  S.board[mv.to[0]][mv.to[1]] = pc;
  S.board[mv.from[0]][mv.from[1]] = null;
  return {cap, pc};
}
function aiUndoMove(mv,u){
  S.board[mv.from[0]][mv.from[1]] = u.pc;
  S.board[mv.to[0]][mv.to[1]] = u.cap;
}

/* schnelle Zuggenerierung fuer die Suche (ohne Karten-/Feldeffekte) */
function aiMoves(color){
  const out=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=S.board[r][c];
    if(!p || p.color!==color || p.type==='DECOY') continue;
    const raw = rawMoves(S.board, r, c, {});
    for(const m of raw){
      const t = S.board[m.r][m.c];
      if(t && t.type==='K') continue;               // Koenig ist nie schlagbar
      // Geschuetzte Ziele ueberspringen, sonst schlaegt der Bot ins Leere
      if(S.tempShieldProtect && S.tempShieldProtect[0]===m.r && S.tempShieldProtect[1]===m.c) continue;
      if(S.flags.bollwerk && S.flags.bollwerk.square[0]===m.r && S.flags.bollwerk.square[1]===m.c
         && t && t.color===S.flags.bollwerk.owner) continue;
      if(S.flags.eiserneMauer && t && t.type==='P' && t.color===S.flags.eiserneMauer.owner
         && S.flags.eiserneMauer.forColor===color) continue;
      if(S.flags.feldsperre && S.flags.feldsperre.forColor===color
         && pathBlockedByFeldsperre(r, c, m.r, m.c, S.flags.feldsperre.square)) continue;
      const mv = {from:[r,c], to:[m.r,m.c], cap:t};
      const u = aiDoMove(mv);
      const bad = inCheck(S.board, color);
      aiUndoMove(mv,u);
      if(!bad) out.push(mv);
    }
  }
  // Zugordnung: Schlagzuege zuerst, wertvollste Beute voran
  out.sort((a,b)=>{
    const av = a.cap ? materialValue(a.cap)*10 - materialValue(a.cap===null?a.cap:S.board[a.from[0]][a.from[1]]||a.cap) : 0;
    const bv = b.cap ? materialValue(b.cap)*10 : 0;
    return bv - av;
  });
  return out;
}

/* Stellungsbewertung aus Sicht von 'me' */
const AI_PST_PAWN = [
  [0,0,0,0,0,0,0,0],
  [50,50,50,50,50,50,50,50],
  [10,10,20,30,30,20,10,10],
  [5,5,10,25,25,10,5,5],
  [0,0,0,20,20,0,0,0],
  [5,-5,-10,0,0,-10,-5,5],
  [5,10,10,-20,-20,10,10,5],
  [0,0,0,0,0,0,0,0]
];

function aiEval(me){
  const foe = opp(me);
  let score = 0;

  // Material + Aufstellung
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=S.board[r][c];
    if(!p || p.type==='DECOY') continue;
    const sign = p.color===me ? 1 : -1;
    let v = p.type==='K' ? 0 : materialValue(p)*100;
    if(p.type==='P'){
      const row = p.color==='w' ? r : 7-r;
      v += AI_PST_PAWN[row][c];
      if(p.tags && p.tags.stage) v += p.tags.stage*120;   // Aufwertungen zaehlen
    }
    // Zentrumsnaehe leicht belohnen
    const dc = Math.abs(3.5-c), dr = Math.abs(3.5-r);
    v += Math.max(0, 12 - (dc+dr)*2);
    score += sign*v;
  }

  // Bedrohte eigene Figuren bestrafen, bedrohte gegnerische belohnen
  const myAtk = attackSquares(S.board, me);
  const foeAtk = attackSquares(S.board, foe);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=S.board[r][c];
    if(!p || p.type==='DECOY' || p.type==='K') continue;
    const key=r+','+c;
    const val = materialValue(p)*100;
    if(p.color===me && foeAtk.has(key)){
      score -= myAtk.has(key) ? val*0.18 : val*0.55;   // ungedeckt = schlimmer
    }
    if(p.color===foe && myAtk.has(key)){
      score += foeAtk.has(key) ? val*0.12 : val*0.35;
    }
  }

  // Koenigssicherheit
  if(inCheck(S.board, me)) score -= 60;
  if(inCheck(S.board, foe)) score += 55;

  // Beweglichkeit
  score += (myAtk.size - foeAtk.size) * 3;

  // Ressourcen
  score += (S.kristalle[me]-S.kristalle[foe]) * 25;
  score += (S.hand[me].length-S.hand[foe].length) * 18;
  return score;
}

function aiSearch(color, depth, alpha, beta, me, deadline){
  if(Date.now() > deadline) return {score: aiEval(me), timeout:true};
  if(depth<=0) return {score: aiEval(me)};

  const moves = aiMoves(color);
  if(moves.length===0){
    if(inCheck(S.board,color)) return {score: color===me ? -99999+depth : 99999-depth};
    return {score:0};
  }

  let best=null, timeout=false;
  if(color===me){
    let val=-Infinity;
    for(const mv of moves){
      const u=aiDoMove(mv);
      const res=aiSearch(opp(color), depth-1, alpha, beta, me, deadline);
      aiUndoMove(mv,u);
      if(res.timeout) timeout=true;
      if(res.score>val){ val=res.score; best=mv; }
      alpha=Math.max(alpha,val);
      if(alpha>=beta || timeout) break;
    }
    return {score:val, move:best, timeout};
  } else {
    let val=Infinity;
    for(const mv of moves){
      const u=aiDoMove(mv);
      const res=aiSearch(opp(color), depth-1, alpha, beta, me, deadline);
      aiUndoMove(mv,u);
      if(res.timeout) timeout=true;
      if(res.score<val){ val=res.score; best=mv; }
      beta=Math.min(beta,val);
      if(alpha>=beta || timeout) break;
    }
    return {score:val, move:best, timeout};
  }
}

/* Bester Zug mit iterativer Vertiefung */
function aiBestMove(color){
  const cfg = aiCfg();
  const deadline = Date.now() + cfg.time;
  let best=null, bestDepth=0;
  for(let d=1; d<=cfg.depth; d++){
    const res = aiSearch(color, d, -Infinity, Infinity, color, deadline);
    if(res.move && !res.timeout){ best=res.move; bestDepth=d; }
    if(Date.now()>deadline) break;
  }
  if(!best){
    const ms=aiMoves(color);
    best = ms.length?ms[0]:null;
  }
  // Auf niedrigen Stufen gelegentlich nicht den besten Zug waehlen
  if(cfg.slip > 0 && Math.random() < cfg.slip){
    const ms = aiMoves(color);
    if(ms.length > 1){
      // zweitbeste Haelfte: vermeidet grobe Selbstmordzuege, spielt aber ungenau
      const scored = ms.map(mv=>{
        const u = aiDoMove(mv);
        const sc = aiEval(color);
        aiUndoMove(mv,u);
        return {mv, sc};
      }).sort((a,b)=>b.sc-a.sc);
      const from = Math.min(1, scored.length-1);
      const to = Math.max(from+1, Math.ceil(scored.length*0.6));
      const pool = scored.slice(from, to);
      best = pool[Math.floor(Math.random()*pool.length)].mv;
    }
  }
  return {move:best, depth:bestDepth};
}


/* ================= ONLINE-SPIEL (Spielcode, ohne Konto) ================= */
const ONLINE_BASE = 'https://ntfy.sh/';
let onlineCode = null;        // Spielcode
let onlineColor = null;       // eigene Farbe: 'w' (Ersteller) oder 'b' (Beitretender)
let onlineSeq = 0;            // eigener Zaehler
let onlineSeenSeq = -1;       // zuletzt uebernommener Zaehler der Gegenseite
let onlinePollTimer = null;
let onlineLastId = null;
let onlineStatus = '';
let onlineLogMark = 0;            // Stand des Tickers beim letzten Senden
let onlinePendingNotice = null;   // zuletzt gespielte Karte (fuer den Gegner)
let onlinePeerSeen = false;       // Gegenseite hat sich gemeldet
let onlineTries = 0;              // Versuche bis zur ersten Antwort
let onlineOkCount = 0;            // erfolgreiche Abrufe
let onlineSeenIds = new Set();    // bereits verarbeitete Nachrichten

function onlineTopic(){ return 'wandelschach-' + onlineCode; }

function makeGameCode(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return 'WS-' + Array.from({length:5},()=>abc[Math.floor(Math.random()*abc.length)]).join('');
}

/* --- kompakte Zustandsuebertragung --- */
function packStateRaw(){
  const b = [];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p = S.board[r][c];
    if(!p) continue;
    b.push([r, c, p.type, p.color, p.tags && Object.keys(p.tags).length ? p.tags : 0]);
  }
  const hand = col => S.hand[col].map(cd=>[cd.id, cd.ready?1:0]);
  return {
    v:1, t:'state', seq:0, from:onlineColor, lg:[], nc:null,
    b, turn:S.turn,
    k:[S.kristalle.w, S.kristalle.b],
    hw:hand('w'), hb:hand('b'),
    deck:S.deck.map(c=>c.id), disc:S.discard.map(c=>c.id),
    lv:[S.lostValue.w, S.lostValue.b],
    cp:[S.capturedPawns.w, S.capturedPawns.b],
    au:S.abilitiesUsed, fl:S.flags,
    pc:S.playedCardThisTurn?1:0,
    go:S.gameOver||0, ci:S.checkInfo||0
  };
}

function packState(){
  const b = [];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p = S.board[r][c];
    if(!p) continue;
    b.push([r, c, p.type, p.color, p.tags && Object.keys(p.tags).length ? p.tags : 0]);
  }
  const hand = col => S.hand[col].map(cd=>[cd.id, cd.ready?1:0]);
  // seit dem letzten Senden neu entstandene Ticker-Zeilen
  const newLines = Math.max(0, S.log.length - onlineLogMark);
  // Verbindungsmeldungen sind lokal und werden nicht mituebertragen
  const SKIP = ['beigetreten','Verbindung','verlassen','wieder aufgenommen','warte auf','Mitspieler','Online-Partie','Spielcode'];
  const lg = S.log.slice(0, Math.min(newLines, 8)).filter(l=>!SKIP.some(k=>l.includes(k)));
  onlineLogMark = S.log.length;
  const nc = onlinePendingNotice; onlinePendingNotice = null;
  return {
    v: 1,
    t: 'state',
    seq: ++onlineSeq,
    from: onlineColor,
    lg, nc,
    b, turn: S.turn,
    k: [S.kristalle.w, S.kristalle.b],
    hw: hand('w'), hb: hand('b'),
    deck: S.deck.map(c=>c.id),
    disc: S.discard.map(c=>c.id),
    lv: [S.lostValue.w, S.lostValue.b],
    cp: [S.capturedPawns.w, S.capturedPawns.b],
    au: S.abilitiesUsed,
    fl: S.flags,
    pc: S.playedCardThisTurn ? 1 : 0,
    go: S.gameOver || 0,
    ci: S.checkInfo || 0
  };
}

function unpackState(d){
  if(!d || d.v!==1) return;
  S.board = Array.from({length:8},()=>Array(8).fill(null));
  d.b.forEach(([r,c,type,color,tags])=>{
    S.board[r][c] = {type, color, tags: tags || {}};
  });
  S.turn = d.turn;
  S.kristalle = {w:d.k[0], b:d.k[1]};
  const mk = arr => arr.map(([id,ready])=>{
    const def = CARD_DEFS.find(x=>x.id===id) || {id, name:id, type:'Aktion', cost:0, desc:''};
    return {...def, uid:'net-'+Math.random(), ready: !!ready};
  });
  S.hand = {w: mk(d.hw), b: mk(d.hb)};
  const byId = id => { const def = CARD_DEFS.find(x=>x.id===id); return {...def, uid:'net-'+Math.random(), ready:true}; };
  S.deck = d.deck.map(byId);
  S.discard = d.disc.map(byId);
  S.lostValue = {w:d.lv[0], b:d.lv[1]};
  S.capturedPawns = {w:d.cp[0], b:d.cp[1]};
  S.abilitiesUsed = d.au;
  S.flags = d.fl;
  S.playedCardThisTurn = !!d.pc;
  S.gameOver = d.go || null;
  S.checkInfo = d.ci || null;
  S.mode = null; S.selected = null; S.legalMoves = [];
  S.pendingCapture = null; S.pendingWarning = null; S.selectedCard = null;
  render();
}

/* --- Senden --- */
async function onlinePost(payload){
  try{
    await fetch(ONLINE_BASE + onlineTopic(), {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    onlineStatus = 'verbunden';
    return true;
  }catch(e){
    onlineStatus = 'keine Verbindung';
    log('Keine Verbindung zum Online-Dienst \u2013 Datei lokal öffnen statt über Vorschau-Link.');
    render();
    return false;
  }
}

async function onlineSend(){
  if(!onlineCode) return;
  await onlinePost(packState());
  onlineSaveSession();
}

async function onlineHello(){
  if(!onlineCode) return;
  await onlinePost({v:1, t:'hello', from:onlineColor, seq:0});
}

/* --- Empfangen (Abfrage alle 2 s) --- */
async function onlinePoll(){
  if(!onlineCode) return;
  try{
    const url = ONLINE_BASE + onlineTopic() + '/json?poll=1&since=' + (onlineLastId ? onlineLastId : '6h');
    const res = await fetch(url);
    const text = await res.text();
    text.split('\n').filter(Boolean).forEach(line=>{
      let msg; try{ msg = JSON.parse(line); }catch(e){ return; }
      if(msg.id){
        if(onlineSeenIds.has(msg.id)) return;      // schon verarbeitet
        onlineSeenIds.add(msg.id);
        if(onlineSeenIds.size > 200){              // Speicher begrenzen
          onlineSeenIds = new Set(Array.from(onlineSeenIds).slice(-100));
        }
        onlineLastId = msg.id;
      }
      if(!msg.message) return;
      let d; try{ d = JSON.parse(msg.message); }catch(e){ return; }
      if(d.from === onlineColor) return;            // eigene Nachricht

      if(d.t === 'hello'){
        onlinePeerSeen = true;
        log(`${d.from==='w'?'Weiß':'Schwarz'} ist beigetreten.`);
        // Jede Seite schickt dem Neuling sofort ihren aktuellen Stand
        onlineSend();
        render();
        return;
      }
      if(d.t === 'bye'){
        onlinePeerSeen = false;
        log(`${d.from==='w'?'Weiß':'Schwarz'} hat die Partie verlassen.`);
        render(); return;
      }

      if(d.seq <= onlineSeenSeq) return;            // schon gesehen
      onlineSeenSeq = d.seq;
      playOpponentUpdate(d);
    });
    onlineStatus = 'verbunden';
    if(onlineOkCount === 0) log('Verbindung zum Online-Dienst steht.');
    onlineOkCount++;

    // Solange sich niemand gemeldet hat: Anmeldung wiederholen
    if(!onlinePeerSeen && onlineCode){
      onlineTries++;
      if(onlineTries % 3 === 0){          // alle ~6 Sekunden
        onlineHello();
        if(onlineColor === 'w') onlineSend();
      }
      if(onlineTries === 15){
        log('Noch kein Mitspieler \u2013 hat er denselben Code eingegeben?');
        render();
      }
    }
  }catch(e){
    onlineStatus = 'offline';
    if(onlineOkCount === 0 && onlineTries < 3){
      onlineTries++;
      log('Keine Verbindung zum Online-Dienst. Seite bitte direkt öffnen, nicht über einen Vorschau-Link.');
      render();
    }
  }
}

function boardFromMsg(d){
  const b = Array.from({length:8},()=>Array(8).fill(null));
  (d.b||[]).forEach(([r,c,type,color,tags])=>{ b[r][c] = {type, color, tags: tags||{}}; });
  return b;
}

function findMoveDiff(before, after, foe){
  let from=null, to=null;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const a=before[r][c], b=after[r][c];
    const wasFoe = a && a.color===foe, isFoe = b && b.color===foe;
    if(wasFoe && !isFoe) from = {r,c,piece:a};
    if(isFoe && (!a || a.type!==b.type || a.color!==b.color)) to = {r,c,piece:b};
  }
  return {from, to};
}

/* Vergleicht altes und neues Brett und zeigt den gegnerischen Zug
   mit derselben Animation wie beim Computergegner. */
function showOpponentMove(before, after, foe){
  let from=null, to=null;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const a=before[r][c], b=after[r][c];
    const sameA = a && a.color===foe, sameB = b && b.color===foe;
    if(sameA && !sameB) from = {r,c,piece:a};
    if(sameB && (!a || a.type!==b.type || a.color!==b.color)) to = {r,c,piece:b};
  }
  if(!to) return;
  const gType = actsAsRook(to.piece) ? 'R' : to.piece.type;
  const glyph = GLYPH[foe] ? GLYPH[foe][gType] : null;
  markBotPlacement(to.r, to.c, from?from.r:null, from?from.c:null, glyph);
}

/* --- Sitzung ueber ein Neuladen der Seite hinweg sichern --- */
const ONLINE_STORE = 'wandelschach-session';

function onlineSaveSession(){
  if(!onlineCode) return;
  try{
    const data = {
      code: onlineCode, color: onlineColor,
      seq: onlineSeq, seen: onlineSeenSeq,
      ts: Date.now(),
      state: packStateRaw()
    };
    localStorage.setItem(ONLINE_STORE, JSON.stringify(data));
  }catch(e){ /* Speicher nicht verfuegbar - dann eben ohne Wiederaufnahme */ }
}

function onlineClearSession(){
  try{ localStorage.removeItem(ONLINE_STORE); }catch(e){}
}

function onlineRestoreSession(){
  let data = null;
  try{ data = JSON.parse(localStorage.getItem(ONLINE_STORE) || 'null'); }catch(e){ return false; }
  if(!data || !data.code) return false;
  if(Date.now() - (data.ts||0) > 12*60*60*1000){ onlineClearSession(); return false; }

  onlineCode = data.code;
  onlineColor = data.color;
  onlineSeq = data.seq || 0;
  onlineSeenSeq = data.seen != null ? data.seen : -1;
  onlineLastId = null;
  onlineLogMark = 0; onlinePendingNotice = null;
  onlinePeerSeen = false; onlineTries = 0; onlineOkCount = 0; onlineSeenIds = new Set();
  botColor = null;
  if(data.state) unpackState(data.state);
  if(onlinePollTimer) clearInterval(onlinePollTimer);
  onlinePollTimer = setInterval(onlinePoll, 2000);
  log(`Partie ${onlineCode} wieder aufgenommen \u2013 du spielst ${onlineColor==='w'?'Weiß':'Schwarz'}.`);
  onlineHello();        // Gegenseite informieren und ggf. frischen Stand anfordern
  onlinePoll();
  render();
  return true;
}

/* Spielt den gegnerischen Zug sichtbar nach:
   erst die ziehende Figur markieren, kurz warten, dann setzen -
   genau wie beim Computergegner. */
function playOpponentUpdate(d){
  const foe = opp(onlineColor);
  const before = cloneBoard(S.board);
  const after  = boardFromMsg(d);
  const {from, to} = findMoveDiff(before, after, foe);

  const applyRest = ()=>{
    unpackState(d);
    if(Array.isArray(d.lg)) d.lg.slice().reverse().forEach(l=>log(l));
    onlineLogMark = S.log.length;
    if(to){
      const gType = actsAsRook(to.piece) ? 'R' : to.piece.type;
      const glyph = GLYPH[foe] ? GLYPH[foe][gType] : null;
      markBotPlacement(to.r, to.c, from?from.r:null, from?from.c:null, glyph);
    }
    if(d.nc) S.botCardNotice = {color: foe, name: d.nc.name, desc: d.nc.desc};
    onlineSaveSession();
    render();
  };

  if(from){
    // Schritt 1: Figur des Gegners hervorheben
    S.selected = [from.r, from.c];
    S.legalMoves = [];
    render();
    setTimeout(()=>{ S.selected = null; applyRest(); }, 700);
  } else {
    applyRest();
  }
}

function onlineStart(code, color){
  onlineCode = (code||'').trim().toUpperCase();
  if(!onlineCode) return;
  onlineColor = color;
  onlineSeq = 0; onlineSeenSeq = -1; onlineLastId = null;
  onlineLogMark = 0; onlinePendingNotice = null;
  onlinePeerSeen = false; onlineTries = 0; onlineOkCount = 0; onlineSeenIds = new Set();
  if(onlinePollTimer) clearInterval(onlinePollTimer);
  onlinePollTimer = setInterval(onlinePoll, 2000);
  botColor = null;                                  // Bot aus im Online-Spiel
  S.menuOpen = false;
  log(`Online-Partie "${onlineCode}" – du spielst ${color==='w'?'Weiß':'Schwarz'}.`);
  if(color==='w'){
    newGame();
    log(`Online-Partie ${onlineCode} eröffnet \u2013 warte auf den Gegenspieler.`);
    onlineHello();
    onlineSend();
  } else {
    log(`Partie ${onlineCode} beigetreten \u2013 warte auf den Spielstand.`);
    onlineHello();
    onlinePoll();
  }
  render();
}

function copyGameCode(){
  const code = onlineCode || S.gameCode;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code);
      log('Spielcode ' + code + ' in die Zwischenablage kopiert.');
    } else {
      const ta=document.createElement('textarea');
      ta.value=code; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      log('Spielcode ' + code + ' kopiert.');
    }
  }catch(e){
    log('Spielcode: ' + code + ' (bitte manuell notieren).');
  }
  onlineSaveSession();
  render();
}

function onlineLeave(){

  if(onlinePollTimer) clearInterval(onlinePollTimer);

/* ================= COMPUTERGEGNER ================= */
let botColor = null;          // null = aus, 'b' = Bot spielt Schwarz
let botBusy = false;

function toggleBot(){
  if (typeof onlineCode!=='undefined' && onlineCode) {
    log('Im Online-Spiel ist der Computergegner nicht verfügbar.');
    render();
    return;
  }
  botColor = botColor ? null : 'b';
  S.menuOpen = false;
  log(botColor ? 'Computergegner aktiviert (spielt Schwarz).' : 'Computergegner deaktiviert.');
  render();
  scheduleBot();
}

function markBotPlacement(r,c,fromR,fromC,glyph){
  const tag = [r,c];
  S.botPlaced = tag;
  if (fromR!=null && glyph) {
    const g = {r:fromR, c:fromC, glyph, t0: Date.now()};
    S.botGhost = g;
    setTimeout(()=>{ if(S.botGhost===g){ S.botGhost=null; render(); } }, 1350);
  }
  render();
  setTimeout(()=>{ if(S.botPlaced===tag){ S.botPlaced=null; render(); } }, 750);
}

function botAllMoves(color){
  const out=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=S.board[r][c];
    if(p && p.color===color && p.type!=='DECOY')
      legalMovesFor(r,c).forEach(m=>out.push({from:[r,c],to:[m.r,m.c]}));
  }
  return out;
}

function botPickMove(color){
  const r = aiBestMove(color);
  return r.move;
}

/* Bedrohungsanalyse: welche eigenen Figuren stehen im Feuer? */
function botThreats(color){
  const foeAtk = attackSquares(S.board, opp(color));
  const ownAtk = attackSquares(S.board, color);
  const list = [];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=S.board[r][c];
    if(!p || p.color!==color || p.type==='DECOY') continue;
    const key=r+','+c;
    if(foeAtk.has(key)) list.push({r,c,piece:p,value:materialValue(p),defended:ownAtk.has(key)});
  }
  list.sort((a,b)=>b.value-a.value);
  return list;
}

// Wartet der Bot auf eine Entscheidung des Menschen?
function humanPromptOpen(){
  if(S.pendingWarning) return true;
  if(S.pendingCapture && S.pendingCapture.victimColor !== botColor) return true;
  if(S.mode && S.mode.type==='gegenschlag-offer' && S.mode.victimColor !== botColor) return true;
  return false;
}

function botHasPrompt(){
  if(S.pendingCapture && S.pendingCapture.victimColor === botColor) return true;
  if(S.mode && S.mode.type==='gegenschlag-offer' && S.mode.victimColor === botColor) return true;
  return false;
}

let botWatchdog = null;

function botWatchdogCheck(){
  if(!botColor || S.gameOver) return;
  if(S.botCardNotice || humanPromptOpen()) return;   // legitimes Warten
  if(S.turn===botColor || botHasPrompt()){
    // Bot ist dran, tut aber nichts -> neu anstossen
    botBusy = false;
    scheduleBot(200);
  }
}

function armBotWatchdog(){
  if(botWatchdog) clearTimeout(botWatchdog);
  botWatchdog = setTimeout(botWatchdogCheck, 4000);
}

function scheduleBot(delay){
  if(!botColor || S.gameOver || botBusy) return;
  if(S.botCardNotice) return;              // wartet auf OK des Spielers
  if(humanPromptOpen()) return;
  armBotWatchdog();
  if(!botHasPrompt() && S.turn !== botColor) return;
  botBusy = true;
  setTimeout(()=>{ botBusy=false; try{ botStep(); }catch(e){ console.error(e); } }, delay==null?1200:delay);
}

function botStep(){
  if(!botColor || S.gameOver) return;
  botClicking = true;
  try { botStepInner(); } finally { botClicking = false; }
}

function botStepInner(){
  if(!botColor || S.gameOver) return;
  if(S.botCardNotice) return;
  if(humanPromptOpen()) return;

  // 1) Eigene Reaktionsangebote beantworten
  if(S.pendingCapture && S.pendingCapture.victimColor===botColor){
    const opts = S.pendingCapture.options;
    if(opts.length && Math.random()<0.75) resolvePendingCapture(opts[0].id);
    else resolvePendingCapture(null);
    return scheduleBot(800);
  }
  if(S.mode && S.mode.type==='gegenschlag-offer' && S.mode.victimColor===botColor){
    if(Math.random()<0.85){
      resolveGegenschlag(true);
      const e = modeEligibleSquares();
      if(e.length) onSquareClick(e[0][0], e[0][1]);
      else { S.mode=null; finishTurnFlow(); }
    } else resolveGegenschlag(false);
    return scheduleBot(800);
  }

  if(S.turn !== botColor) return;

  // 2) Kettenzug fortsetzen, falls offen
  if(S.chainHint && S.legalMoves.length){
    const o = S.legalMoves;
    const pick = o[Math.floor(Math.random()*o.length)];
    const src = S.selected ? [S.selected[0], S.selected[1]] : null;
    const mp = src ? S.board[src[0]][src[1]] : null;
    const cg = mp ? GLYPH[botColor][actsAsRook(mp)?'R':mp.type] : null;
    onSquareClick(pick.r, pick.c);
    markBotPlacement(pick.r, pick.c, src?src[0]:null, src?src[1]:null, cg);
    return scheduleBot(950);
  }

  // 3) Karte ziehen
  if(S.kristalle[botColor] >= drawCostFor(botColor) && S.hand[botColor].length < HAND_LIMIT && Math.random()<0.6){
    drawCard(botColor);
    return scheduleBot(800);
  }

  // 4) Karte spielen - Auswahl nach Lage, nicht nach Zufall
  const playable = ['kristallsegen1','kristallraub','eisernemauer','zeitdruck','damenopfer',
                    'beforderung','springerinstinkt','wiedergeburt','laeuferwandel','feldsperre','duo'];
  const handFull = S.hand[botColor].length >= HAND_LIMIT;
  const threats = botThreats(botColor);
  const worst = threats[0] || null;
  const pawnsThreatened = threats.filter(t=>t.piece.type==='P').length;
  const bigThreat = worst && worst.value>=3 && !worst.defended;

  // Nutzen jeder Karte in der aktuellen Lage bewerten (0 = nicht spielen)
  const cardScore = (cd)=>{
    switch(cd.id){
      case 'eisernemauer':   return pawnsThreatened>=2 ? 9 : (pawnsThreatened===1 ? 3 : 0);
      case 'kristallraub':   return S.kristalle[opp(botColor)]>0 ? 6 : 0;
      case 'kristallsegen1': return S.kristalle[botColor] <= KRISTALL_CAP-2 ? 7 : 1;
      case 'zeitdruck':      return S.hand[opp(botColor)].some(c=>c.ready) ? 5 : 1;
      case 'damenopfer': {
        const q = threats.find(t=>t.piece.type==='Q' && !t.defended);
        return q ? 8 : 0;                       // nur wenn die Dame ohnehin faellt
      }
      case 'feldsperre':     return bigThreat ? 6 : 1;
      case 'wiedergeburt':   return S.capturedPawns[botColor]>0 ? 5 : 0;
      case 'beforderung':    return bigThreat ? 1 : 6;
      case 'duo':            return bigThreat ? 1 : 5;
      case 'springerinstinkt':
      case 'laeuferwandel':  return bigThreat ? 1 : 4;
      default: return 2;
    }
  };

  let bestIdx=-1, bestVal=0;
  for(let i=0;i<S.hand[botColor].length;i++){
    const cd = S.hand[botColor][i];
    if(!cd.ready || !playable.includes(cd.id)) continue;
    const cost = Math.max(0, cd.cost - (isBehind(botColor)?1:0));
    if(S.kristalle[botColor] < cost) continue;
    let v = cardScore(cd);
    if(handFull) v += 3;                        // Hand freiraeumen
    if(v > bestVal){ bestVal = v; bestIdx = i; }
  }
  if(bestIdx>=0 && bestVal>=4){
    const i = bestIdx;
    const cd = S.hand[botColor][i];
    {
    const notice = {color: botColor, name: cd.name, desc: cd.desc};
    const handBefore = S.hand[botColor].length;
    playCard(botColor, i);
    if(S.pendingWarning && S.pendingWarning.color===botColor) resolvePendingWarning();
    const started = (S.hand[botColor].length < handBefore) || (S.mode && S.mode.color===botColor);
    if(started) S.botCardNotice = notice;   // nur echte Kartenspiele melden
    // Auswahl-Schritte der Karte automatisch bedienen (z.B. Duo braucht zwei Klicks)
    let guard = 0;
    while(S.mode && S.mode.color===botColor && guard++ < 6){
      let elig = modeEligibleSquares();
      // im zweiten Auswahlschritt niemals die erste Wahl erneut anklicken (das wuerde sie aufheben)
      if(S.mode.first){
        const f = S.mode.first;
        elig = elig.filter(sq=>!(sq[0]===f[0] && sq[1]===f[1]));
      }
      if(!elig.length){ S.mode = null; break; }
      const pick = elig[0];
      const before = S.mode.type;
      onSquareClick(pick[0], pick[1]);
      if(S.mode && S.mode.type===before && !S.mode.first) break;   // kein Fortschritt
    }
    // Sicherheitsnetz: haengende Auswahl beenden, damit keine Endlosschleife entsteht
    if(S.mode && S.mode.color===botColor) S.mode = null;
    if(S.pendingWarning && S.pendingWarning.color===botColor) resolvePendingWarning();
    if(started){ render(); return scheduleBot(800); }   // Meldung sofort anzeigen
    }
  }

  // 5) Bauern aufwerten - bevorzugt weit vorgerueckte, sichere Bauern
  if(S.kristalle[botColor] >= UPGRADE_COST + 1 && !bigThreat){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p=S.board[r][c];
      if(p && p.color===botColor && p.type==='P' && !p.tags.isDuo && (p.tags.stage||0)<2){
        S.kristalle[botColor]-=UPGRADE_COST;
        p.tags.stage=(p.tags.stage||0)+1;
        log(`${label(botColor)} wertet einen Bauern auf Stufe ${p.tags.stage} auf (${UPGRADE_COST} Kristalle).`);
        render();
        return scheduleBot(800);
      }
    }
  }

  // 5b) Figurenfaehigkeit einsetzen - nach Lage priorisiert
  {
    const th = botThreats(botColor);
    const rookThreat  = th.find(t=>t.piece.type==='R' && !t.defended);
    const queenSafe   = !th.find(t=>t.piece.type==='Q');
    // Bollwerk sofort, wenn ein Turm ungedeckt im Feuer steht
    if(rookThreat && abilityAvailable(botColor,'R')){
      startAbility(botColor,'R');
      const e = modeEligibleSquares().filter(sq=>sq[0]===rookThreat.r && sq[1]===rookThreat.c);
      const pick = e.length?e[0]:(modeEligibleSquares()[0]||null);
      if(pick){ onSquareClick(pick[0],pick[1]); return scheduleBot(900); }
      S.mode=null;
    }
    // Kristallschub, wenn die Dame sicher steht und Kristalle knapp sind
    if(queenSafe && abilityAvailable(botColor,'Q') && S.kristalle[botColor]<=KRISTALL_CAP-2 && Math.random()<0.5){
      startAbility(botColor,'Q');
      const e = modeEligibleSquares();
      if(e.length){ onSquareClick(e[0][0],e[0][1]); return scheduleBot(900); }
      S.mode=null;
    }
  }
  if(Math.random() < 0.18){
    const abilityOrder = ['N','B','P'];           // Bewegungsfaehigkeiten nur gelegentlich
    for(const type of abilityOrder){
      if(!abilityAvailable(botColor, type)) continue;
      startAbility(botColor, type);
      if(!S.mode){                       // Kristallschub wirkt sofort ohne Auswahl
        return scheduleBot(800);
      }
      const elig = modeEligibleSquares();
      if(!elig.length){ S.mode = null; continue; }   // Faehigkeit gerade nicht nutzbar -> naechste probieren
      const pick = elig[Math.floor(Math.random()*elig.length)];
      onSquareClick(pick[0], pick[1]);
      // Faehigkeiten mit Zugauswahl: erstes Ziel anklicken (Kette laeuft ueber Schritt 2 weiter)
      if(S.mode && S.legalMoves && S.legalMoves.length){
        const d = S.legalMoves[Math.floor(Math.random()*S.legalMoves.length)];
        const src = S.selected ? [S.selected[0], S.selected[1]] : null;
        const mp = src ? S.board[src[0]][src[1]] : null;
        const cg = mp ? GLYPH[botColor][actsAsRook(mp)?'R':mp.type] : null;
        onSquareClick(d.r, d.c);
        markBotPlacement(d.r, d.c, src?src[0]:null, src?src[1]:null, cg);
      }
      return scheduleBot(950);
    }
    if(S.mode && S.mode.color===botColor) S.mode = null;
  }

  // 5c) Doppelschritt-Karte (mehrstufige Zugkette)
  const dsIdx = S.hand[botColor].findIndex(c=>c.id==='doppelschritt' && c.ready);
  if(dsIdx>=0 && Math.random()<0.5){
    const cost = Math.max(0, S.hand[botColor][dsIdx].cost - (isBehind(botColor)?1:0));
    if(S.kristalle[botColor] >= cost){
      const dsCard = S.hand[botColor][dsIdx];
      S.botCardNoticePending = {color: botColor, name: dsCard.name, desc: dsCard.desc};
      playCard(botColor, dsIdx);
      const elig = modeEligibleSquares();
      if(elig.length){
        const pick = elig[Math.floor(Math.random()*elig.length)];
        onSquareClick(pick[0], pick[1]);
        if(S.legalMoves && S.legalMoves.length){
          const d = S.legalMoves[Math.floor(Math.random()*S.legalMoves.length)];
          const src = S.selected ? [S.selected[0], S.selected[1]] : null;
          const mp = src ? S.board[src[0]][src[1]] : null;
          const cg = mp ? GLYPH[botColor][actsAsRook(mp)?'R':mp.type] : null;
          onSquareClick(d.r, d.c);
          markBotPlacement(d.r, d.c, src?src[0]:null, src?src[1]:null, cg);
        }
        if(S.botCardNoticePending){ S.botCardNotice = S.botCardNoticePending; S.botCardNoticePending = null; render(); }
        return scheduleBot(950);
      }
      S.botCardNoticePending = null;
      if(S.mode && S.mode.color===botColor) S.mode = null;
    }
  }

  // 6) Ziehen
  const mv = botPickMove(botColor);
  if(!mv){ return; }
  const movingPiece = S.board[mv.from[0]][mv.from[1]];
  const gType = movingPiece ? (actsAsRook(movingPiece) ? 'R' : movingPiece.type) : null;
  const gGlyph = gType ? GLYPH[botColor][gType] : null;
  onSquareClick(mv.from[0], mv.from[1]);
  setTimeout(()=>{
    onSquareClick(mv.to[0], mv.to[1]);
    markBotPlacement(mv.to[0], mv.to[1], mv.from[0], mv.from[1], gGlyph);
    scheduleBot(950);
  }, 700);
}

/* Nach jedem Klick des Menschen pruefen, ob der Bot dran ist */
let botClicking = false;
const _origOnSquareClick = onSquareClick;
onSquareClick = function(r,c){
  _origOnSquareClick(r,c);
  scheduleBot();
};
const _origResolvePendingCapture = resolvePendingCapture;
resolvePendingCapture = function(x){ _origResolvePendingCapture(x); scheduleBot(); };
const _origResolveGegenschlag = resolveGegenschlag;
resolveGegenschlag = function(x){ _origResolveGegenschlag(x); scheduleBot(); };
const _origResolvePendingWarning = resolvePendingWarning;
resolvePendingWarning = function(){ _origResolvePendingWarning(); scheduleBot(); };
const _origUpgradePawnAt = upgradePawnAt;
upgradePawnAt = function(r,c){ _origUpgradePawnAt(r,c); scheduleBot(); };
const _origPlayCard = playCard;
playCard = function(color, idx, force){ _origPlayCard(color, idx, force); scheduleBot(); };
const _origDrawCard = drawCard;
drawCard = function(color){ _origDrawCard(color); scheduleBot(); };

newGame();
try{ onlineRestoreSession(); }catch(e){}
</script>
